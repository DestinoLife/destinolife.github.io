name: Signaler un bug
description: Quelque chose ne marche pas ou n'a pas de sens dans Destino
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Merci de tester Destino ! Décris ce qui s'est passé, on s'en occupe.
  - type: textarea
    id: probleme
    attributes:
      label: Qu'est-ce qui ne va pas ?
      placeholder: "Ex. : après une overdose, l'écran de fin de vie est illisible."
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire ?
      placeholder: "1. J'ai cliqué sur…  2. Puis…"
  - type: textarea
    id: capture
    attributes:
      label: Capture d'écran (facultatif)
      description: Glisse une image ici.
  - type: textarea
    id: infos
    attributes:
      label: Infos de la partie (remplies automatiquement par le jeu)
      render: text
  - type: dropdown
    id: appareil
    attributes:
      label: Appareil
      options: [Ordinateur, Téléphone, Tablette]
